    title: Now
    status: planned
    sections:
      - title: On now
        items:
          - {entity: light.living_ceiling, as: summary}
          - {entity: light.kitchen, as: summary}
      - title: Routines
        items:
          - {entity: script.good_night, as: owner}
          - {entity: scene.movie_night, as: owner}
  - id: living
    title: Living room
    status: planned
    sections:
      - title: Living room
        items:
          - {entity: light.living_ceiling, as: owner}
          - {entity: climate.living_ac, as: owner}
          - {entity: media_player.living_tv, as: owner}
  - id: entrance
    title: Entrance
    status: planned
    sections:
      - title: Entrance
        items:
          - {entity: lock.front_door, as: owner, confirm: true}
          - {entity: cover.garage_door, as: owner, confirm: true}
